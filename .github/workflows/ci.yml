name: CI Pipeline (Build, Unit, Integration & API Tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e ".[test]"
          python -m build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Unit Tests
        run: |
          mkdir -p reports
          pytest tests/test_unit.py -v --junitxml=reports/unit-test-report.xml

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-test-report.xml

  integration-and-api-tests:
    name: Integration & API Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: rental_student
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: rental_variant16_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: rental_variant16_test
      DB_USER: rental_student
      DB_PASSWORD: test_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (with testcontainers & requests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[regression]" requests

      - name: Apply SQL migrations to Postgres service
        run: |
          PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USER -d $DB_NAME -v ON_ERROR_STOP=1 -f migrations/V1__create_tables.sql

      - name: Run Integration & API Tests (Lab 1-3)
        run: |
          mkdir -p reports
          pytest tests/test_environment.py tests/test_lab.py tests/test_lab2.py tests/test_lab3.py -v --junitxml=reports/integration-api-report.xml

      - name: Upload Integration & API Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-api-test-report
          path: reports/integration-api-report.xml